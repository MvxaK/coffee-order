spring.application.name=coffee
server.port=8082

jwt.expiration=8640000
jwt.secret=${JWT}

coffee.service-token=${CAMUNDA_COFFEE_ORDER_KEY}

camunda.url=${CAMUNDA_URL}
camunda.order-process-key=${CAMUNDA_ORDER_PROCESS_KEY}

spring.datasource.url=jdbc:postgresql://${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.cache.type=redis

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

logging.level.org.springframework.security=DEBUG
logging.level.org.cook.coffee.security=DEBUG

logging.level.org.springframework.web=DEBUG